name: Build Python APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests beautifulsoup4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK via Flet
        run: |
          # Явно передаем путь к Android SDK, который предустановлен в системе Actions
          flet build apk --no-analytics --android-sdk-path $ANDROID_SDK_ROOT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zastogram-parser-apk
          path: build/apk/*.apk
