name: Build Python APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet CLI
        run: |
          pip install --upgrade pip
          pip install flet Jsoup requests beautifulsoup4

      - name: Build APK via Flet
        run: |
          flet build apk --no-analytics

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zastogram-parser-apk
          path: build/apk/*.apk
