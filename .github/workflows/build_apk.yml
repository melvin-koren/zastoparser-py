name: Build Python APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests beautifulsoup4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flet Build Environment
        run: |
          # Создаем экспорт проекта для сборки
          flet pack main.py --as-service || true

      - name: Build Android APK
        run: |
          # Прямая сборка через встроенный шаблонизатор Flet CLI
          flet build apk --no-analytics --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zastogram-parser-apk
          path: build/apk/*.apk
